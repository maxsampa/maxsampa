name: Update contribution streak
on:
  schedule:
    - cron: '23 9 * * *' # Daily at 06:23 in America/Fortaleza (UTC-3)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_streak.py
      - scripts/test_update_streak.py
      - .github/workflows/update-streak.yml
permissions:
  contents: write
concurrency:
  group: contribution-streak
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test streak rules
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate card from GitHub contributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_streak.py
      - name: Publish updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-streak.svg
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh contribution streak'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

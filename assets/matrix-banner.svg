<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Fabio Ribeiro — Applied AI and Automation</title>
  <desc id="desc">A dark terminal with softly falling green code, inspired by Matrix.</desc>
  <defs>
    <linearGradient id="edge" x2="1" y2="1">
      <stop stop-color="#063c27"/><stop offset=".5" stop-color="#03120c"/><stop offset="1" stop-color="#0b3323"/>
    </linearGradient>
    <linearGradient id="shade">
      <stop stop-color="#030b07" stop-opacity=".96"/><stop offset=".65" stop-color="#030b07" stop-opacity=".87"/><stop offset="1" stop-color="#030b07" stop-opacity=".18"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#39ff88" stroke-opacity=".045"/>
    </pattern>
    <pattern id="code" width="160" height="420" patternUnits="userSpaceOnUse">
      <g font-family="monospace" font-size="15" fill="#27ed83" text-anchor="middle">
        <text x="20" y="0" style="writing-mode:vertical-rl;letter-spacing:12px" opacity=".45">01アイ10ウ01エ10オ01カ10</text>
        <text x="60" y="-100" style="writing-mode:vertical-rl;letter-spacing:12px" opacity=".22">10キ01ク10ケ01コ10サ01シ</text>
        <text x="100" y="-40" style="writing-mode:vertical-rl;letter-spacing:12px" opacity=".65">01ス10セ01ソ10タ01チ10ツ</text>
        <text x="140" y="-160" style="writing-mode:vertical-rl;letter-spacing:12px" opacity=".28">10テ01ト10ナ01ニ10ヌ01ネ</text>
      </g>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="358" rx="18"/></clipPath>
  </defs>
  <style>
    .rain { animation: fall 22s linear infinite; }
    .rain-slow { animation: fall 34s linear infinite; }
    .cursor { animation: blink 1.8s steps(1,end) infinite; }
    @keyframes fall { from { transform: translateY(-420px); } to { transform: translateY(0); } }
    @keyframes blink { 0%,55% { opacity:1; } 56%,100% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) { .rain,.rain-slow,.cursor { animation:none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#030b07"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <g class="rain"><rect x="680" width="520" height="840" fill="url(#code)"/></g>
    <g class="rain-slow" opacity=".25"><rect x="0" width="680" height="840" fill="url(#code)"/></g>
    <rect width="1200" height="360" fill="url(#shade)"/>
    <path d="M0 47H1200" stroke="#163d28"/>
    <g fill="#3ce88c"><circle cx="28" cy="24" r="4"/><circle cx="45" cy="24" r="4" opacity=".5"/><circle cx="62" cy="24" r="4" opacity=".25"/></g>
    <text x="88" y="29" fill="#7c9e88" font-family="monospace" font-size="13">maxsampa / portfolio</text>
    <text x="58" y="101" fill="#4df79b" font-family="monospace" font-size="14" letter-spacing="3">&gt; BUILD. CONNECT. AUTOMATE.</text>
    <text x="54" y="180" fill="#e4ffed" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="64" letter-spacing="-2">Fabio Ribeiro</text>
    <text x="58" y="224" fill="#a7cdb5" font-family="Arial, Helvetica, sans-serif" font-size="22">Software AI Engineer · Applied AI &amp; Automation</text>
    <path d="M58 254H580" stroke="#1d5536"/>
    <text x="58" y="294" fill="#59f59d" font-family="monospace" font-size="15">&gt; maxsampa</text>
    <rect class="cursor" x="159" y="280" width="9" height="17" fill="#59f59d"/>
    <text x="58" y="329" fill="#638a71" font-family="monospace" font-size="12">APPLIED AI / DATA PIPELINES / AUTOMATION</text>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="none" stroke="url(#edge)" stroke-width="2"/>
</svg>
